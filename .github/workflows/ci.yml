name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Linux container, Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build shared Linux validation container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/ci.Dockerfile
          load: true
          tags: lai-ci:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run CI verification suite (critical mutation tier)
        if: github.event_name != 'schedule'
        run: |
          docker run --rm --init \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e LAI_IN_CONTAINER=1 \
            -e UV_PROJECT_ENVIRONMENT=/opt/lai-venv \
            lai-ci:local \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /workspace
              uv pip install --python /opt/lai-venv/bin/python --no-deps -e /workspace >/dev/null
              export UV_NO_SYNC=1
              mise run ci
            '

      - name: Run scheduled verification suite (full mutation tier)
        if: github.event_name == 'schedule'
        run: |
          docker run --rm --init \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e LAI_IN_CONTAINER=1 \
            -e UV_PROJECT_ENVIRONMENT=/opt/lai-venv \
            lai-ci:local \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /workspace
              uv pip install --python /opt/lai-venv/bin/python --no-deps -e /workspace >/dev/null
              export UV_NO_SYNC=1
              mise run lint
              mise run typecheck
              mise run boundaries
              mise run schema
              mise run build
              mise run test
              mise run mutate-full
            '
