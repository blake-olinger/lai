name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Python 3.13)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Lint and file size budget
        run: uv run python scripts/verify.py lint

      - name: Typecheck (basedpyright + mypy)
        run: uv run python scripts/verify.py typecheck

      - name: Architectural boundary contracts
        run: uv run python scripts/verify.py boundaries

      - name: Validate OpenAPI 3.1 schema
        run: uv run python scripts/verify.py schema

      - name: Verify sdist and wheel build
        run: uv build --no-sources

      - name: Run unit and integration tests with coverage
        run: uv run python scripts/verify.py test --cov-fail-under 90

      - name: Run critical mutation tests
        if: github.event_name != 'schedule'
        run: uv run python scripts/verify.py mutate --tier critical

      - name: Run full mutation tests (scheduled)
        if: github.event_name == 'schedule'
        run: uv run python scripts/verify.py mutate --tier full
