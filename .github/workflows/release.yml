name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Verify, Build, and Publish Release
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.13"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Verify release tag matches pyproject.toml version
        run: uv run python scripts/bump_version.py --check-tag "${{ github.ref_name }}"

      - name: Run full verification suite
        run: uv run python scripts/verify.py all --tier full --cov-fail-under 90

      - name: Build sdist and wheel
        run: uv build --no-sources

      - name: Export OpenAPI 3.1 schema and API reference artifacts
        run: uv run python scripts/export_openapi.py --output dist/openapi.json --markdown-output dist/api-reference.md

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: dist/*
