name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Verify, Build, and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Run full verification suite
        run: uv run python scripts/verify.py all --tier full --cov-fail-under 90

      - name: Build sdist and wheel
        run: uv build

      - name: Export OpenAPI 3.1 schema artifact
        run: uv run python scripts/export_openapi.py --output dist/openapi.json

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
