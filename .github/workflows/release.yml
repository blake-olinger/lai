name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Verify, Build, and Publish Release
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Run full verification suite
        run: uv run python scripts/verify.py all --tier full --cov-fail-under 90

      - name: Build sdist and wheel
        run: uv build --no-sources

      - name: Export OpenAPI 3.1 schema and API reference artifacts
        run: uv run python scripts/export_openapi.py --output dist/openapi.json --markdown-output dist/api-reference.md

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: dist/*
