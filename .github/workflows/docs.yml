name: Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GitHub Pages Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build shared Linux validation container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/ci.Dockerfile
          load: true
          tags: lai-ci:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build static Scalar OpenAPI documentation site inside container
        run: |
          docker run --rm --init \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e LAI_IN_CONTAINER=1 \
            -e UV_PROJECT_ENVIRONMENT=/opt/lai-venv \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            lai-ci:local \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /workspace
              uv pip install --python /opt/lai-venv/bin/python --no-deps -e /workspace >/dev/null
              export UV_NO_SYNC=1
              mise run docs
              chown -R "${HOST_UID}:${HOST_GID}" site
            '

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
