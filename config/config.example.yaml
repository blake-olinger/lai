# Local AI Platform (LAI) Example Configuration (Linux / Ubuntu x64)
# Copy to config/config.yaml or set LAI_CONFIG_FILE=/etc/lai/config.yaml.
# Precedence: CLI flags > LAI_* env vars > YAML config > defaults.

host: "127.0.0.1"
port: 8400
# Pure Linux x64 llama.cpp server (Gemma 4 GPU on :8081, ShieldGemma-2B CPU on :8082)
llama_host: "127.0.0.1"
llama_port: 8081

data_dir: "data"
models_dir: "models"
bin_dir: "bin"

# Upload, context windowing, spooler, and proxy keepalive tuning
# Note: Cloudflare Tunnel free/pro proxies enforce a 100 MB per-request body limit.
max_upload_bytes: 262144000
direct_file_budget_tokens: 12000
map_window_tokens: 9000
map_window_overlap_tokens: 300
max_queued_jobs: 64
keepalive_interval_seconds: 10.0
json_keepalive_threshold_seconds: 20.0
rate_limit_rpm: 120
ip_rate_limit_rpm: 240

# Multi-tenant per-principal quotas (enforced for all non-admin principals)
max_projects_per_principal: 10
max_storage_bytes_per_principal: 1073741824 # 1 GiB
max_queued_jobs_per_principal: 4

# Browser CORS allowlist (exact http:// or https:// origins; wildcard "*" is rejected)
cors_allowed_origins: []
# Optional additional allowed browser request headers beyond core/LAI/OpenAI SDK defaults
cors_extra_allow_headers: []

# Authentication providers: ["api_key"] or ["api_key", "oidc"]
auth_providers:
  - "api_key"

# Optional OIDC JWT authentication (Google OIDC or Microsoft Entra ID v2.0)
# Fail-closed: requires non-empty oidc_audiences and oidc_allowed_emails or oidc_allowed_domains.
# Consumer domains (gmail.com, yahoo.com, outlook.com, etc.) are rejected in oidc_allowed_domains.
oidc_enabled: false
oidc_issuer_url: "https://accounts.google.com"
oidc_jwks_url: "https://www.googleapis.com/oauth2/v3/certs"
oidc_audience: null
oidc_audiences: [] # Expected JWT `aud` values (e.g. Entra API App ID or Google OAuth client ID)
oidc_allowed_client_ids: [] # Optional calling client IDs (`azp`/`appid`) distinct from `aud` (Entra v2 SPA/Desktop)
oidc_allowed_emails: []
oidc_allowed_domains: []
# Set to false for Microsoft Entra ID v2 tokens that omit `email_verified`
oidc_require_email_verified: true
oidc_allow_guest_users: false # Reject Entra B2B guest tokens (`acct != 0` or external `idp`)
oidc_identity_claims:
  - "email"
  - "preferred_username"
  - "upn"
oidc_leeway_seconds: 30.0
oidc_default_scopes:
  - "projects:read"
  - "projects:write"
  - "files:read"
  - "files:write"
  - "chat:read"
  - "chat:write"
  - "tools:safe"
oidc_admin_emails: [] # Only grants ADMIN when `email_verified: true` or Entra `xms_edov: true`
oidc_admin_roles: [] # Entra App Roles (`roles` claim) granting ADMIN (e.g. ["LAI.Admin"])
oidc_admin_subjects: [] # Immutable `oid` (Entra) or `sub` identifiers granting ADMIN

# Reverse-proxy client IP trust (enable only when traffic cannot bypass your proxy)
trust_cloudflare_headers: false
# Trusted proxy CIDRs for X-Forwarded-For / X-Azure-ClientIP / CF-Connecting-IP (e.g. ["127.0.0.1/32", "::1/128"])
trusted_proxy_cidrs: []
# Header inspected when peer IP matches trusted_proxy_cidrs: "x-forwarded-for", "x-azure-clientip", or "cf-connecting-ip"
proxy_ip_header: "x-forwarded-for"

# Optional Cloudflare Access edge verification (leave false for public SPA/Desktop OIDC APIs)
cf_access_enabled: false
cf_access_client_id: null
cf_access_client_secret: null
cf_access_team_domain: null
cf_access_aud: null

# Primary model profile (Gemma 4 26B-A4B MoE with pinned HuggingFace revision & SHA-256)
default_model_profile: "gemma4-26b-a4b"
custom_profiles: {}

# Boot-only GGUF supply-chain integrity and allowlist enforcement
model_integrity:
  strict_allowlist: true
  verify_sha256_on_startup: true
  approved_model_sha256s: []
  allowed_hf_repos: []

# CPU-only ShieldGemma-2B ingress + buffered egress safety guardrail (boot-locked by default)
guardrails:
  enabled: true
  block_mode: "refusal_message" # "refusal_message" or "http_error"
  output_mode: "buffered" # "buffered", "audit_only", or "off"
  allow_runtime_disable: false # Boot-only lock: prevents live API from disabling guardrails or enabling fail_open
  max_violation_threshold: 0.95 # Boot-only ceiling for runtime violation_threshold updates
  refusal_text: "I cannot fulfill this request because the prompt was flagged by the safety guardrail policy."
  host: "127.0.0.1"
  port: 8082
  hf_repo: "QuantFactory/shieldgemma-2b-GGUF"
  fallback_hf_repo: "mradermacher/shieldgemma-2b-GGUF"
  hf_filename: "shieldgemma-2b.Q4_K_M.gguf"
  hf_revision: "8755ece4b20dd84d7564131e385d9c205d03621a"
  sha256: "47b0c3f4ec0bf93659ab2fc92cf2041374ef78bf1cb5b8c790421f463e7b7979"
  ctx_size: 8192
  parallel_slots: 1
  timeout_seconds: 30.0
  violation_threshold: 0.80
  fail_open: false
  max_logged_prompt_chars: 2000

# 24-hour rotating structured logs, error routing, SMTP email & webhook alerting
log_level: "INFO"
log_json: false
logging:
  log_dir: "data/logs"
  level: "INFO"
  json_console: false
  enable_file_logs: true
  rotation_when: "midnight"
  rotation_interval: 1
  retention_days: 14
  error_retention_days: 30
  compress_rotated: true
  alert_cooldown_seconds: 60.0
  alert_on_timeouts: true
  alert_on_errors: true
  # Optional secondary webhook sink (set secret URL via LAI_LOGGING__ALERT_WEBHOOK_URL)
  alert_webhook_url: null
  alert_webhook_enabled: true
  alert_webhook_min_severity: "error" # "error" or "critical"
  alert_webhook_categories: [] # empty = all categories
  # Optional primary outbound SMTP email alert sink (set password via LAI_LOGGING__ALERT_SMTP__PASSWORD)
  alert_smtp:
    enabled: false
    host: null # e.g. "smtp.office365.com" or "smtp.mailgun.org"
    port: 587
    tls_mode: "starttls" # "starttls", "ssl", or "none"
    username: null
    password: null # Prefer env var LAI_LOGGING__ALERT_SMTP__PASSWORD instead of committing in YAML
    from_address: null # e.g. "alerts@yourcompany.com"
    to_addresses: [] # Explicit recipients; if empty and fallback is true, uses oidc_admin_emails
    use_admin_emails_fallback: true
    subject_prefix: "[LAI Alert]"
    timeout_seconds: 10.0
    min_severity: "error" # "error" or "critical"
    categories: [] # empty = all categories

# Built-in privacy-preserving hourly endpoint, token, and guardrail efficacy analytics
analytics:
  enabled: true
  retention_days: 90

# Verified atomic wheel upgrades & automatic rollback (`lai upgrade` / `lai-upgrade.timer`)
updates:
  enabled: false # Opt-in: keep false unless automated systemd timer upgrades are desired
  github_repo: "blake-olinger/lai"
  releases_dir: "/opt/lai/releases"
  current_symlink: "/opt/lai/current"
  backups_dir: "/var/lib/lai/backups"
  service_name: "lai.service"
  health_url: "http://127.0.0.1:8400/v1/health"
  health_timeout_seconds: 300.0
  health_poll_interval_seconds: 1.0
  keep_releases: 3
  auto_rollback: true
  allow_prerelease: false
