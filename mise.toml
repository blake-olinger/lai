[tools]
uv = "0.13"

[tasks.setup]
description = "Install Python 3.13 and sync locked project dependencies"
run = [
    "uv python install 3.13",
    "uv sync --locked",
]

[tasks.fmt]
description = "Autofix lint issues then format source and tests with ruff"
run = [
    "uv run python -m ruff check --fix src tests scripts",
    "uv run python -m ruff format src tests scripts",
]

[tasks.build]
description = "Build sdist and wheel without local source overrides"
run = "uv build --no-sources"

[tasks.lint]
description = "Run ruff lint, format check, and 350-line file size guard"
run = "uv run python scripts/verify.py lint"

[tasks.typecheck]
description = "Run basedpyright (strict) and mypy (strict)"
run = "uv run python scripts/verify.py typecheck"

[tasks.boundaries]
description = "Check architectural layer and independence contracts"
run = "uv run python scripts/verify.py boundaries"

[tasks.test]
description = "Run unit and integration tests with coverage"
run = "uv run python scripts/verify.py test --cov-fail-under 90"

[tasks.test-hardware]
description = "Run opt-in hardware tests against live ONNX models and local binaries"
run = "uv run python -m pytest tests/hardware -m hardware -v"

[tasks.schema]
description = "Validate exported OpenAPI schema"
run = "uv run python scripts/verify.py schema"

[tasks.bump]
description = "Bump SemVer version and sync lockfile, OpenAPI docs, and CHANGELOG"
run = "uv run python scripts/bump_version.py"

[tasks.mutate]
description = "Run critical-tier mutation tests with pytest-gremlins"
run = "uv run python scripts/verify.py mutate --tier critical"

[tasks.mutate-full]
description = "Run full-tier mutation tests with pytest-gremlins"
run = "uv run python scripts/verify.py mutate --tier full"

[tasks.verify]
description = "Run full local verification suite"
run = "uv run python scripts/verify.py all --skip-mutate --cov-fail-under 90"
