[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lai"
version = "0.1.0"
description = "Local AI platform for multi-project chat, log and code analysis, and guarded tool execution"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "lancedb>=0.17",
    "fastembed>=0.5",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "sse-starlette>=2.2",
    "structlog>=24.4",
    "typer>=0.15",
    "huggingface-hub>=0.27",
    "tiktoken>=0.8",
    "PyJWT[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "respx>=0.22",
    "ruff>=0.9",
    "basedpyright>=1.23",
    "mypy>=1.14",
    "types-PyYAML",
    "import-linter>=2.1",
    "openapi-spec-validator>=0.7",
    "pytest-gremlins",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "YTT",
    "ANN",
    "ASYNC",
    "S",
    "BLE",
    "B",
    "A",
    "C4",
    "DTZ",
    "T20",
    "PIE",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "TID",
    "TC",
    "ARG",
    "PTH",
    "PL",
    "TRY",
    "FLY",
    "PERF",
    "RUF",
    "C901",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "lai.domain.base.StrictModel",
    "lai.domain.base.MutableStateModel",
]
runtime-evaluated-decorators = [
    "fastapi.FastAPI.get",
    "fastapi.FastAPI.post",
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.delete",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/lai/inference/supervisor.py" = ["S603", "S607"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]
reportMissingTypeStubs = false

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["lancedb.*", "fastembed.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "lai"

[[tool.importlinter.contracts]]
name = "Clean architectural layers"
type = "layers"
layers = [
    "lai.api | lai.cli",
    "lai.orchestrator",
    "lai.scheduler | lai.tools | lai.inference | lai.ingestion | lai.db | lai.security | lai.config",
    "lai.observability",
    "lai.ports",
    "lai.domain",
]

[[tool.importlinter.contracts]]
name = "Independent infrastructure subsystems"
type = "independence"
modules = [
    "lai.security",
    "lai.db",
    "lai.inference",
    "lai.ingestion",
    "lai.tools",
    "lai.scheduler",
]
