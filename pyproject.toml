[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lai"
version = "0.1.0"
description = "Local AI platform for multi-project chat, log and code analysis, and guarded tool execution"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
authors = [{ name = "Blake Olinger", email = "hello@blakeolinger.dev" }]
keywords = [
    "ai",
    "llm",
    "local-ai",
    "fastapi",
    "llama-cpp",
    "guardrails",
    "rag",
    "oidc",
    "sse",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "lancedb>=0.17",
    "fastembed>=0.5",
    "httpx>=0.28",
    "python-multipart>=0.0.27",
    "sse-starlette>=2.2",
    "structlog>=24.4",
    "typer>=0.15",
    "huggingface-hub>=0.27",
    "tiktoken>=0.8",
    "PyJWT[crypto]>=2.10",
]

[project.urls]
Homepage = "https://github.com/blake-olinger/lai"
Documentation = "https://blake-olinger.github.io/lai/"
Repository = "https://github.com/blake-olinger/lai"
Issues = "https://github.com/blake-olinger/lai/issues"
Security = "https://github.com/blake-olinger/lai/security/policy"

[project.scripts]
lai = "lai.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "respx>=0.22",
    "ruff>=0.9",
    "basedpyright>=1.23",
    "mypy>=1.14",
    "types-PyYAML",
    "import-linter>=2.1",
    "openapi-spec-validator>=0.7",
    "pytest-gremlins",
]

[tool.uv]
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel]
packages = ["src/lai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
xfail_strict = true
tmp_path_retention_policy = "none"
markers = [
    "hardware: Opt-in tests exercising live ONNX models and local inference binaries",
]
addopts = "--strict-markers --strict-config -ra -m 'not hardware'"

[tool.coverage.run]
branch = true
source_pkgs = ["lai"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    'if __name__ == "__main__":',
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "YTT",
    "ANN",
    "ASYNC",
    "S",
    "BLE",
    "B",
    "A",
    "C4",
    "DTZ",
    "T20",
    "PIE",
    "PT",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "TID",
    "TC",
    "ARG",
    "PTH",
    "PL",
    "TRY",
    "FLY",
    "PERF",
    "RUF",
    "C901",
    "FAST",
    "FURB",
    "LOG",
    "G",
    "PGH",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "lai.domain.base.StrictModel",
    "lai.domain.base.MutableStateModel",
]
runtime-evaluated-decorators = [
    "fastapi.FastAPI.get",
    "fastapi.FastAPI.post",
    "fastapi.FastAPI.put",
    "fastapi.FastAPI.patch",
    "fastapi.FastAPI.delete",
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.delete",
    "typer.Typer.command",
    "typer.Typer.callback",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests", "scripts"]
reportMissingTypeStubs = false

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "scripts"]
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["lancedb.*", "fastembed.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "lai"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean architectural layers"
type = "layers"
layers = [
    "lai.cli",
    "lai.api",
    "lai.orchestrator",
    "lai.scheduler | lai.tools | lai.guardrails | lai.inference | lai.ingestion | lai.db | lai.security | lai.config | lai.updates",
    "lai.observability",
    "lai.ports",
    "lai.domain",
]

[[tool.importlinter.contracts]]
name = "Independent infrastructure subsystems"
type = "independence"
modules = [
    "lai.security",
    "lai.db",
    "lai.inference",
    "lai.guardrails",
    "lai.ingestion",
    "lai.tools",
    "lai.scheduler",
    "lai.config",
    "lai.updates",
]

[[tool.importlinter.contracts]]
name = "Domain and ports stay framework-free"
type = "forbidden"
source_modules = [
    "lai.domain",
    "lai.ports",
]
forbidden_modules = [
    "fastapi",
    "uvicorn",
    "typer",
    "httpx",
    "aiosqlite",
    "lancedb",
    "fastembed",
    "pydantic_settings",
    "yaml",
    "structlog",
    "jwt",
    "sse_starlette",
    "huggingface_hub",
    "tiktoken",
    "python_multipart",
]
